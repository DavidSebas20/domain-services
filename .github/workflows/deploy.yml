name: Deploy Microservices on AWS with Terraform Integration
on:
  push:
    branches:
      - Dev
      - QA
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Checkout del código fuente
      - name: Checkout Source
        uses: actions/checkout@v4

      # Paso 2: Login a Docker Hub
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      # Paso 3: Construir y subir las imágenes Docker para cada microservicio
      - name: Build and Push Docker Images
        run: |
          for dir in $(ls -d */); do
            service_name=$(basename "$dir")
            echo "Building Docker image for $service_name..."
            docker build -t dssanguano/${service_name}:${{ github.ref_name }} "$dir"
            docker push dssanguano/${service_name}:${{ github.ref_name }}
          done

  deploy-to-terraform-instance:
    if: github.ref_name == 'Dev' || github.ref_name == 'QA' || github.ref_name == 'main'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Paso 4: Configurar AWS CLI
      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set aws_session_token 
          aws configure set region us-east-1

      # Paso 5: Desregistrar y terminar instancias actuales
      - name: Deregister and Terminate Instances
        run: |
          # Obtener el ARN del Target Group
          TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups --names chatbot-tg-2000 --query 'TargetGroups[0].TargetGroupArn' --output text)

          # Obtener las IDs de las instancias registradas en el Target Group
          INSTANCE_IDS=$(aws elbv2 describe-target-health --target-group-arn $TARGET_GROUP_ARN --query 'TargetHealthDescriptions[*].Target.Id' --output text)

          # Desregistrar las instancias del Target Group
          for instance_id in $INSTANCE_IDS; do
            echo "Deregistering instance $instance_id from target group..."
            aws elbv2 deregister-targets --target-group-arn $TARGET_GROUP_ARN --targets Id=$instance_id
          done

          # Terminar las instancias
          for instance_id in $INSTANCE_IDS; do
            echo "Terminating instance $instance_id..."
            aws ec2 terminate-instances --instance-ids $instance_id
          done

      # Paso 6: Esperar a que el ASG cree nuevas instancias
      - name: Wait for New Instances
        run: |
          # Esperar 2 minutos para que el ASG detecte la falta de instancias y cree nuevas
          echo "Waiting for new instances to be created by the Auto Scaling Group..."
          sleep 120

      # Paso 7: Verificar que las nuevas instancias están registradas
      - name: Verify New Instances in Target Group
        run: |
          TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups --names chatbot-tg-2000 --query 'TargetGroups[0].TargetGroupArn' --output text)
          NEW_INSTANCE_IDS=$(aws elbv2 describe-target-health --target-group-arn $TARGET_GROUP_ARN --query 'TargetHealthDescriptions[*].Target.Id' --output text)
          echo "New instances registered in Target Group: $NEW_INSTANCE_IDS"