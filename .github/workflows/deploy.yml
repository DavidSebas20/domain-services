name: Deploy Microservices on AWS with Terraform Integration
on:
  push:
    branches:
      - Dev
      - QA
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Checkout del código fuente
      - name: Checkout Source
        uses: actions/checkout@v4

      # Paso 2: Login a Docker Hub
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      # Paso 3: Construir y subir las imágenes Docker para cada microservicio
      - name: Build and Push Docker Images
        run: |
          for dir in $(ls -d */); do
            service_name=$(basename "$dir")
            echo "Building Docker image for $service_name..."
            docker build -t dssanguano/${service_name}:${{ github.ref_name }} "$dir"
            docker push dssanguano/${service_name}:${{ github.ref_name }}
          done

  deploy-to-terraform-instance:
    if: github.ref_name == 'Dev' || github.ref_name == 'QA' || github.ref_name == 'main'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Paso 4: Configurar clave SSH para acceder a la instancia EC2 creada con Terraform
      - name: Set up SSH key for Terraform Instance
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.TERRAFORM_SSH_KEY }}" > /home/runner/.ssh/terraform_key.pem
          chmod 600 /home/runner/.ssh/terraform_key.pem

      # Paso 5: Eliminar instancias del Target Group
      - name: Remove Instances from Target Group
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set aws_session_token 
          aws configure set region us-east-1
          TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups --names chatbot-tg-2000 --query 'TargetGroups[0].TargetGroupArn' --output text)
          INSTANCE_IDS=$(aws elbv2 describe-target-health --target-group-arn $TARGET_GROUP_ARN --query 'TargetHealthDescriptions[*].Target.Id' --output text)
          for instance_id in $INSTANCE_IDS; do
            echo "Deregistering instance $instance_id from target group..."
            aws elbv2 deregister-targets --target-group-arn $TARGET_GROUP_ARN --targets Id=$instance_id
          done

      # Paso 6: Desplegar en la instancia EC2 usando Docker Compose
      - name: Deploy ms-chatbot to Terraform Instance
        run: |
          ssh -o StrictHostKeyChecking=no -i /home/runner/.ssh/terraform_key.pem ubuntu@ec2-54-175-100-230.compute-1.amazonaws.com << 'EOF'
          # Diagnosticar el contenido del directorio
          echo "Contents of /home/ubuntu:"
          ls -la /home/ubuntu

          # Verificar e instalar Docker si no está instalado
          if ! command -v docker &> /dev/null; then
            echo "Docker no está instalado. Procediendo a instalar..."
            sudo apt update
            sudo apt install -y docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker ubuntu
            echo "Docker instalado exitosamente."
          else
            echo "Docker ya está instalado."
          fi

          # Verificar e instalar Docker Compose si no está instalado
          if ! command -v docker-compose &> /dev/null; then
            echo "Docker Compose no está instalado. Procediendo a instalar..."
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            echo "Docker Compose instalado exitosamente."
          else
            echo "Docker Compose ya está instalado."
          fi

          # Crear archivo docker-compose.yml dinámicamente para ms-chatbot
          cd /home/ubuntu
          echo "version: '3'" > docker-compose.yml
          echo "services:" >> docker-compose.yml
          echo "  ms-chatbot:" >> docker-compose.yml
          echo "    image: dssanguano/ms-chatbot:${{ github.ref_name }}" >> docker-compose.yml
          echo "    ports:" >> docker-compose.yml
          echo "      - \"2000:2000\"" >> docker-compose.yml
          echo "    environment:" >> docker-compose.yml
          echo "      URL: \"${{ secrets.URL }}\"" >> docker-compose.yml
          echo "      OPENAI_API_KEY: \"${{ secrets.OPENAI_API_KEY }}\"" >> docker-compose.yml

          # Desplegar con Docker Compose
          sudo docker-compose down || true
          sudo docker-compose pull
          sudo docker-compose up -d
          EOF